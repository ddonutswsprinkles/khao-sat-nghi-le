<style>
:root{--bg:#eef1ec;--ink:#1f2a26;--mute:#5d6b65;--red:#a8231b;--gold:#c8962e;--card:#fbfcfa;--line:#d3dad3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Be Vietnam Pro",system-ui,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:28px 0 60px}
h1,h2{font-family:"Noto Serif",Georgia,serif;line-height:1.3;margin:0 0 12px}
h1{font-size:28px}h2{font-size:22px}p{margin:0 0 14px}.mute{color:var(--mute);font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:20px}
.bar i{display:block;height:100%;background:var(--red);border-radius:3px;transition:width .3s}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.q[hidden]{display:none}.q.err{border-color:var(--red)}
.q>b{display:block;margin-bottom:8px;font-weight:600}.q b em{color:var(--red);font-style:normal}
label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
input[type=radio],input[type=checkbox]{margin-top:5px;accent-color:var(--red)}
.sc{display:flex;gap:6px}.sc label{flex:1;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 0;position:relative}
.sc label:has(input:checked){background:var(--red);color:#fff;border-color:var(--red)}
.sc input{position:absolute;opacity:0}.sc label:has(input:focus-visible){outline:3px solid var(--gold)}
.sl{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin:6px 0}
.gr{padding:10px 0;border-top:1px solid var(--line)}.gr>span{display:block;margin-bottom:6px;font-size:15px}
textarea,input[type=email],input[type=number],input[type=text],select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;margin:4px 0}
.sub{font-size:14px;margin-top:8px;display:block}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px 22px;cursor:pointer;background:var(--red);color:#fff}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.nav{display:flex;justify-content:space-between;margin-top:20px}
.msg{color:var(--red);font-size:14px;min-height:20px;margin-top:10px}
.intro{border-left:5px solid var(--gold);padding-left:16px}
.q.info{background:#f6f1e3;border-color:var(--gold)}.q.info b{margin-bottom:6px}.q.info p{margin:0 0 8px}.q.info ul{margin:6px 0 0;padding-left:20px}.q.info li{margin-bottom:6px}
.na{font-size:14px;color:var(--mute);padding:8px 0 0}
</style>

const Q={};S.forEach(s=>s.qs.forEach(q=>Q[q.id]=q));
const sh=q=>!q.show||q.show(a);
const gk=(q,i)=>q.id+(q.ab?"abcdefghijklmnop"[i]:"_"+i);
const keys=q=>q.t=="i"?[]:q.t=="g"?q.rows.map((_,i)=>gk(q,i)):(q.t=="d"||q.t=="n")?q.subs.map((_,i)=>q.id+"abcd"[i]):[q.id];
let a={},step=0,fin=null,outMsg=OUT;
try{const d=JSON.parse(localStorage.getItem(KEY)||"{}");a=d.a||{};step=d.s||0;if(localStorage.getItem(DONE))fin="ok"}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({a,s:step}))}catch(e){}};
const $=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const scale=(n,v,na)=>`<div class="sc">`+[1,2,3,4,5].map(i=>`<label><input type="radio" name="${n}" value="${i}"${v==i?" checked":""}>${i}</label>`).join("")+`</div>`+(na?`<label class="na"><input type="radio" name="${n}" value="${NA}"${v===NA?" checked":""}>Không áp dụng / chưa gặp</label>`:"");
const leg=q=>`<div class="sl"><span>1 = ${q.lo}</span><span>5 = ${q.hi}</span></div>`;
function qh(q){
 if(q.t=="i")return `<div class="q info" id="q-${q.id}"${sh(q)?"":" hidden"}><b>${esc(q.t2)}</b>${q.h}</div>`;
 const tx=typeof q.q=="function"?q.q(a):q.q,id=q.id,o=typeof q.o=="function"?q.o(a):q.o;
 let h=`<div class="q" id="q-${id}"${sh(q)?"":" hidden"}><b>${esc(tx)}${q.opt?"":" <em>*</em>"}</b>`;
 const kh=`<input type="text" name="${id}_khac" placeholder="Ghi rõ (không bắt buộc)" value="${esc(a[id+"_khac"]||"")}">`;
 if(q.t=="r"||q.t=="c"){const c=q.t=="c"?"checkbox":"radio";
  h+=o.map(x=>`<label><input type="${c}" name="${id}" value="${esc(x)}"${(q.t=="c"?(a[id]||[]).includes(x):a[id]===x)?" checked":""}>${esc(x)}</label>`+(q.kh&&x=="Khác"?kh:"")).join("");
  if(q.max)h+=`<div class="mute">Chọn tối đa ${q.max}.</div>`}
 if(q.t=="s")h+=leg(q)+scale(id,a[id]);
 if(q.t=="g")h+=leg(q)+q.rows.map((r,i)=>`<div class="gr"><span>${esc(r)}</span>${scale(gk(q,i),a[gk(q,i)],q.na)}</div>`).join("");
 if(q.t=="d")h+=q.subs.map((s,i)=>`<label class="sub">${s}</label><select name="${id}${"abc"[i]}"><option value="">Chọn...</option>${q.o.map(x=>`<option${a[id+"abc"[i]]===x?" selected":""}>${esc(x)}</option>`).join("")}</select>`).join("");
 if(q.t=="n")h+=q.subs.map((s,i)=>`<label class="sub">${s}</label><input type="number" min="0" inputmode="numeric" name="${id}${"abcd"[i]}" value="${esc(a[id+"abcd"[i]]??"")}">`).join("");
 if(q.t=="x")h+=`<textarea name="${id}" rows="4">${esc(a[id]||"")}</textarea>`;
 if(q.t=="e")h+=`<input type="email" name="${id}" autocomplete="email" value="${esc(a[id]||"")}">`;
 return h+"</div>";
}
async function send(st,full){
 if(!/^https:/.test(SCRIPT_URL))throw new Error("cfg");
 const cols=["time","status"],p={time:new Date().toISOString(),status:st};
 S.forEach(s=>s.qs.forEach(q=>{if(q.id=="mail"||!sh(q))return;
  (q.kh?[...keys(q),q.id+"_khac"]:keys(q)).forEach(k=>{if(a[k]===undefined)return;cols.push(k);p[k]=Array.isArray(a[k])?a[k].join(" | "):a[k]})}));
 p.cols=cols;if(full&&a.mail&&sh(Q.mail))p.mail=a.mail;
 await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(p)});
}
function done(h){$.innerHTML=h;scrollTo(0,0)}
function render(){
 if(fin=="ok")return done(`<h1>Cảm ơn bạn</h1><p>Câu trả lời của bạn đã được gửi. Nhóm chỉ dùng cho báo cáo học tập.</p>`);
 if(fin=="out")return done(`<h1>Cảm ơn bạn</h1><p>${outMsg}</p>`);
 if(fin=="no")return done(`<h1>Cảm ơn bạn</h1><p>Vì bạn không đồng ý tham gia, nhóm không ghi lại câu trả lời nào.</p>`);
 const s=S[step];
 $.innerHTML=`<div class="bar"><i style="width:${(step+1)/S.length*100}%"></i></div><p class="mute">Bước ${step+1}/${S.length}</p><h2>${s.t}</h2>${s.intro?`<div class="intro"><p>${s.intro}</p></div><br>`:""}<form id="f" novalidate>${s.qs.map(qh).join("")}</form><div class="msg" id="msg" role="alert"></div><div class="nav"><button class="g" id="bk"${step==0?" disabled":""}>Quay lại</button><button id="nx">${step==S.length-1?"Gửi câu trả lời":"Tiếp tục"}</button></div>`;
 f.oninput=f.onchange=e=>{
  const t=e.target,n=t.name;if(!n)return;const q=Q[n]||{};msg.textContent="";
  if(t.type=="checkbox"){
   if(t.checked){f.querySelectorAll(`[name=${n}]:checked`).forEach(i=>{if(i!=t&&(EX.has(t.value)||EX.has(i.value)))i.checked=false});
    if(q.max&&f.querySelectorAll(`[name=${n}]:checked`).length>q.max){t.checked=false;msg.textContent="Chỉ chọn tối đa "+q.max+" mục."}}
   a[n]=[...f.querySelectorAll(`[name=${n}]:checked`)].map(i=>i.value);
  }else a[n]=t.value;
     if(n=="q6"&&a.q7&&!(a.q6||[]).includes(a.q7))delete a.q7;
   s.qs.forEach(x=>{const el=document.getElementById("q-"+x.id);if(x.show)el.hidden=!sh(x);
    if((typeof x.o=="function"||typeof x.q=="function")&&x.id!=n.split("_")[0])el.outerHTML=qh(x)});
  save();
 };
 bk.onclick=()=>{step--;save();render();scrollTo(0,0)};
 nx.onclick=async()=>{
  let bad=null;
  s.qs.forEach(q=>{const el=document.getElementById("q-"+q.id);if(!sh(q))return;
   const ok=q.opt||keys(q).every(k=>{const v=a[k];return Array.isArray(v)?v.length:v!==undefined&&String(v).trim()!==""});
   el.classList.toggle("err",!ok);if(!ok&&!bad)bad=q.id});
  if(bad){msg.textContent="Bạn chưa trả lời câu có dấu *.";document.getElementById("q-"+bad).scrollIntoView({block:"center"});return}
  if(sh(Q.q12)&&a.q12a&&new Set([a.q12a,a.q12b,a.q12c]).size<3){msg.textContent="Hãy chọn 3 việc khác nhau.";return}
  if(sh(Q.q22)&&a.q22a!==undefined){const[v,w,x,y]=["a","b","c","d"].map(l=>+a["q22"+l]);if(!(y>=0&&y<v&&v<w&&w<x)){msg.textContent="Kiểm tra lại giá: mức nghi ngờ chất lượng < rẻ < hơi đắt < quá đắt.";return}}
  const hit=s.qs.find(q=>q.end&&q.end.includes(a[q.id]));
  if(hit){
   if(hit.id=="q0"){fin="no";try{localStorage.removeItem(KEY)}catch(e){}return render()}
   try{await send(hit.st,false)}catch(e){}
   outMsg=hit.out||OUT;fin="out";try{localStorage.removeItem(KEY)}catch(e){}return render();
  }
  if(step<S.length-1){step++;save();render();scrollTo(0,0);return}
  nx.disabled=true;nx.textContent="Đang gửi...";
  try{await send(sh(Q.q9)?"hoan_thanh":"hoan_thanh_nhanh_ngan",true);try{localStorage.removeItem(KEY);localStorage.setItem(DONE,"1")}catch(e){}fin="ok";render()}
  catch(e){nx.disabled=false;nx.textContent="Gửi câu trả lời";msg.textContent=e.message=="cfg"?"Chưa cấu hình SCRIPT_URL trong index.html.":"Gửi chưa được. Kiểm tra mạng rồi thử lại, câu trả lời của bạn vẫn còn."}
 };
}
render();
</script>
